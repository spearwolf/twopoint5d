ignore-workspace-root-check: true

packages:
  - packages/*
  - apps/*

# The entries three, @types/three, @spearwolf/eventize and @spearwolf/signalize are the peers of
# the library (the steps of a bump: docs/architecture.md §5). The others are tools that more than
# one manifest names.
catalog:
  '@spearwolf/eventize': ^6.3.0
  '@spearwolf/signalize': ^1.0.0
  '@types/node': ^24.19.2
  '@types/three': ~0.187.0
  playwright: ^1.65.0
  rimraf: ^6.1.4
  three: ~0.187.0
  typescript: ^7.0.2

# pnpm resolves no version published less than a day ago: a compromised release is
# usually found and pulled within hours. The own packages are exempt, so a release of
# eventize or signalize can be taken the day it ships. Dependabot waits as long
# (cooldown in .github/dependabot.yml).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@spearwolf/*'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - nx
  - sharp

overrides:
  # nx 23.3 to 24.0.2 pin undici 7.29.0, inside the range of ten advisories that 7.29.1 fixes,
  # GHSA-rfgv-xxqx-mfg5 and GHSA-w293-vg96-wgc3 among them. Drop this entry once the nx in
  # package.json depends on undici >=7.29.1 itself (24.0.3 does).
  'nx>undici': ^7.29.1
  # rimraf 6.1.3 asks for glob ^13.0.3, inside the range of GHSA-3g3m-2fjr-6pw4, which glob
  # 14.0.2 fixes; glob 14 brings minimatch 11, outside the range of GHSA-g3hv-75wg-m249. rimraf
  # calls glob() and globSync() alone, which glob 14 keeps as they were. Drop this entry once the
  # rimraf in the catalog depends on glob >=14.0.2 itself.
  'rimraf>glob': ^14.0.2

packageExtensions:
  # @astrojs/astro2tsx pins @emnapi/core 1.11.3 but leaves the @emnapi/runtime peer of its
  # @napi-rs/wasm-runtime open, and pnpm fills it with the 2.0.0-beta.2 that rolldown 1.3.0
  # pins. That runtime does not fit core 1.x, astro2tsx fails to load and `astro check`
  # reports @astrojs/check as missing. Drop this entry once astro2tsx declares the runtime
  # itself.
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3

# Advisories that no update and no override can answer. pnpm audit leaves them out, and with it
# the audit step of CI and the audit filter of the deploy (docs/architecture.md §5). Each entry
# says why it cannot reach this workspace and when it can go.
auditConfig:
  ignoreGhsas:
    # minimatch: nx 24.0.0 to 24.0.3 pin minimatch 10.2.5 and call minimatch.makeRe(), which
    # minimatch 11 removes, so an override breaks nx. The advisory needs an optimizationLevel of
    # 2 or more, which nx never sets (the default is 1), and nx matches the patterns of this
    # workspace alone. Drop this entry once the nx in package.json depends on minimatch >=11.0.1.
    - GHSA-g3hv-75wg-m249
    # deepmerge: no release fixes it, and a patch cannot answer it: pnpm audit judges a
    # package by its version, and a patched 4.3.1 is still 4.3.1. Its two callers merge
    # nothing from outside the repo: the nodeResolvePlugin of @web/dev-server merges defaults
    # of its own with the nodeResolve option of
    # packages/twopoint5d-testing/web-test-runner.config.js, which is `true`, and
    # @rollup/plugin-node-resolve copies its own defaults. Drop this entry once deepmerge
    # publishes a fix or both let go of it.
    - GHSA-gcqx-w48m-w2h4
