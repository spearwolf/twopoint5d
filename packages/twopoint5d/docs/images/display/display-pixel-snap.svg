<text x="20" y="30" class="t ink h" text-anchor="start">What pixelSnap fixes</text>
<text x="20" y="50" class="t muted small" text-anchor="start">a strip of pixels of the drawing buffer; each coloured run is one texel of the art as the GPU samples it</text>
<text x="40" y="82" class="t ink small" text-anchor="start">1 · the zoom: 2 CSS pixels at a pixel ratio of 1.25 are 2.5 buffer pixels — texels 2 and 3 wide by turns</text>
