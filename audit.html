  --text: #e2e8f0; --muted: #a9b5c8; --faint: #93a1b7;
  --accent: #a5b4fc; --accent-soft: #232d55;
  --sev-critical: #f58a8a; --sev-high: #f5a36b; --sev-medium: #e9bf5a; --sev-low: #93b8f5; --sev-info: #a3aec0;
  --good: #7fd6a0;
  --chart-area: #2c3a57; --chart-strong: #a9b5c8; --chart-light: #6b7a97;
  color-scheme: dark;
}
@media print {
  :root, [data-theme="dark"], [data-theme="light"] {
    --bg: #fff; --surface: #fff; --surface-2: #f4f4f3; --border: #d6d3d1; --border-strong: #a8a29e;
    --text: #000; --muted: #3f3a36; --faint: #57534e; --accent: #3730a3; --accent-soft: #eef0fb;
    --sev-critical: #b91c1c; --sev-high: #b23a0c; --sev-medium: #8d5a07; --sev-low: #1d4ed8; --sev-info: #57534e;
    --good: #13773a; --chart-area: #e7e5e4; --chart-strong: #57534e; --chart-light: #8f8984;
    color-scheme: light;
  }
  .no-print, .filters, .theme-toggle, .copy-btn { display: none !important; }
  body { padding: 0 !important; }
  details.row, section { break-inside: avoid-page; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 1rem/1.65 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  padding: clamp(16px, 3vw, 40px) clamp(16px, 7vw, 160px) 64px;
  overflow-wrap: break-word;
}
h1, h2, h3 { font-weight: 600; line-height: 1.25; margin: 0; }
h1 { font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2.1rem); }
h2 { font-size: 1.3rem; margin-bottom: 14px; }
h3 { font-size: 1.05rem; }
a { color: var(--accent); }
code { font: 0.9em/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }
p { margin: 0 0 0.8em; }
ul { margin: 0 0 0.8em; padding-left: 1.3em; }
.prose { max-width: 72ch; }
.prose.wide { max-width: none; }
.prose > :last-child { margin-bottom: 0; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 0.875rem; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.875em; overflow-wrap: anywhere; }
section { margin-top: clamp(32px, 4vw, 52px); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: clamp(16px, 2vw, 24px); }

/* Header */
.head { display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: flex-start; justify-content: space-between; }
.head-main { min-width: 0; flex: 1 1 420px; }
.head-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 0.8125rem; line-height: 1.6; }
.score-block { display: flex; gap: 18px; align-items: flex-start; }
.score-big { font-size: clamp(2.6rem, 2rem + 2.5vw, 3.6rem); font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.score-sub { font-size: 0.875rem; color: var(--muted); margin-top: 6px; }
.score-sub b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.trend { font-size: 0.875rem; margin-top: 4px; color: var(--muted); }
.trend .up { color: var(--good); font-weight: 600; }
.trend .down { color: var(--sev-critical); font-weight: 600; }
.compare { margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
.theme-toggle { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 8px; width: 40px; height: 40px; display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.theme-toggle:hover { color: var(--text); border-color: var(--border-strong); }
.theme-toggle svg { width: 18px; height: 18px; }

/* Portrait */
.components { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; margin-top: 18px; }
.comp { display: flex; flex-direction: column; gap: 6px; }
.comp h3 { font-size: 1rem; }
.comp p { margin: 0; font-size: 0.9375rem; color: var(--muted); }
.paths { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.path { font: 0.78rem/1.5 ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2); color: var(--muted); padding: 1px 7px; border-radius: 5px; overflow-wrap: anywhere; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.linkish:disabled { color: var(--faint); text-decoration: none; cursor: default; }
.comp .linkish { font-size: 0.875rem; margin-top: auto; padding-top: 4px; min-height: 32px; }

/* Diagramme */
figure { margin: 22px 0 0; }
figcaption { font-size: 0.875rem; color: var(--muted); margin-top: 10px; max-width: 72ch; }
.diagram { margin-top: clamp(28px, 4vw, 48px); padding: clamp(20px, 3vw, 40px) clamp(0px, 3vw, 40px); }
.diagram figcaption { margin: 18px auto 0; text-align: center; }
.layered { position: relative; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 64px; padding: 8px 0; }
.layer { position: relative; z-index: 1; }
.layer-label { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.layer-nodes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.node { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 8px 14px; text-align: center; font-size: 0.9rem; max-width: 260px; color: var(--text); font-family: inherit; line-height: 1.35; }
.node small { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
button.node { cursor: pointer; }
button.node:hover { border-color: var(--accent); }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.edges path { fill: none; stroke: var(--chart-light); stroke-width: 1.4; }
.edges text { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.edges marker path { fill: var(--chart-light); stroke: none; }
.svg-diagram { overflow-x: auto; }
.svg-diagram svg { width: 100%; height: auto; max-width: 900px; display: block; margin: 0 auto; }
.svg-diagram text, .svg-diagram .label { fill: var(--text); font-family: inherit; }
.svg-diagram .node { fill: var(--surface); stroke: var(--border-strong); }
.svg-diagram .edge { fill: none; stroke: var(--chart-light); }
.svg-diagram .muted { fill: var(--muted); }
.svg-diagram .accent { stroke: var(--accent); }
.svg-diagram text.accent { fill: var(--accent); stroke: none; }

/* Domain-Blöcke: ab 900 px Code & Laufzeit links, Projekt-Harness rechts; innen untereinander
   Zusammenfassung · Schweregrade · Kategorien */
.domains { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .domains { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.domains > * { min-width: 0; }
.domain-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.domain-score { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.domain h4 { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
.bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 10px; align-items: center; font-size: 0.875rem; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 4px; }
.bars .n { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; min-width: 2ch; }
.cats { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; font-size: 0.9rem; }
.cats li { display: flex; justify-content: space-between; gap: 10px; }
.cats .zero { color: var(--faint); }
.cats .n { font-variant-numeric: tabular-nums; }
.packages, .matrix { border-collapse: collapse; font-size: 0.9rem; min-width: 100%; }
.packages th, .packages td, .matrix th, .matrix td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
.packages td.num, .matrix td { text-align: right; font-variant-numeric: tabular-nums; }
.matrix th:not(:first-child) { text-align: right; }
.matrix td button { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 4px 6px; min-width: 32px; text-decoration: underline; text-underline-offset: 2px; }
.matrix td .zero { color: var(--faint); padding: 4px 6px; }
.scroll-x { overflow-x: auto; }

/* Verlauf */
.charts { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .charts.two { grid-template-columns: 1fr 1fr; } }
.chart svg { width: 100%; height: auto; display: block; max-width: 720px; }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .axis-label { fill: var(--faint); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.8125rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Filter */
.filters { display: grid; gap: 10px; margin-bottom: 14px; }
.fgroup { display: flex; gap: 6px; align-items: flex-start; }
.fgroup > .flabel { font-size: 0.8125rem; color: var(--faint); min-width: 72px; min-height: 40px; display: flex; align-items: center; flex: none; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; min-width: 0; }
.fbtn { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; min-height: 40px; font: inherit; font-size: 0.875rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.fbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.fbtn .n { color: var(--faint); font-variant-numeric: tabular-nums; }
.fbtn[disabled] { opacity: 0.45; cursor: default; }
.fbtn[hidden] { display: none; }
select, input[type="search"] { font: inherit; font-size: 0.9rem; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-height: 40px; padding: 6px 10px; max-width: 100%; }
input[type="search"] { flex: 1 1 220px; }
.fstatus { font-size: 0.875rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Backlog und Optimierungspotenzial. Die Spaltenbreiten setzt findingTable() als
   --cols-md/--cols-lg, weil Prio, Feature und Status je Tabelle entfallen können.
   Ab 720 px Tabelle, ab 1200 px zusätzlich Feature und Kategorie als eigene Spalten;
   darunter stehen sie in der Meta-Zeile unter dem Titel. */
.rows { border-top: 1px solid var(--border); }
.row-head-labels { display: none; }
details.row { border-bottom: 1px solid var(--border); }
details.row > summary { list-style: none; cursor: pointer; display: grid; gap: 4px 12px; padding: 12px 4px; min-height: 44px;
  grid-template-columns: auto auto 1fr; grid-template-areas: "sev id dom" "desc desc desc"; align-items: center; }
.no-prio details.row > summary { grid-template-columns: auto 1fr; grid-template-areas: "id dom" "desc desc"; }
details.row > summary::-webkit-details-marker { display: none; }
details.row > summary:hover { background: var(--surface-2); }
details.row[open] > summary { background: var(--surface-2); }
.c-sev { grid-area: sev; }
.c-id { grid-area: id; font: 0.8125rem/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
.c-dom { grid-area: dom; justify-self: end; }
.c-desc { grid-area: desc; min-width: 0; display: grid; gap: 4px; }
.c-title { font-weight: 500; }
.c-meta { font-size: 0.8125rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.c-feat, .c-cat, .c-effort, .c-status { display: none; }
@media (min-width: 720px) {
  .row-head-labels { display: grid; grid-template-columns: var(--cols-md); gap: 12px; padding: 0 4px 6px; font-size: 0.75rem; color: var(--faint); letter-spacing: 0.04em; text-transform: uppercase; }
  .row-head-labels .h-lg { display: none; }
  details.row > summary, .no-prio details.row > summary { grid-template-columns: var(--cols-md); grid-template-areas: none; align-items: start; }
  .c-sev, .c-id, .c-feat, .c-desc, .c-dom, .c-cat, .c-effort, .c-status { grid-area: auto; }
  .c-dom { justify-self: start; }
  .c-effort, .c-status { display: block; font-size: 0.875rem; }
  .c-effort { color: var(--muted); }
  .c-meta .m-md { display: none; }
  .c-sev, .c-id { padding-top: 2px; }
}
@media (min-width: 1200px) {
  .row-head-labels, details.row > summary, .no-prio details.row > summary { grid-template-columns: var(--cols-lg); }
  .row-head-labels .h-lg { display: block; }
  .c-feat, .c-cat { display: block; font-size: 0.875rem; }
  .c-cat { color: var(--muted); }
  .c-meta .m-lg { display: none; }
}
.badge { display: inline-block; border-radius: 5px; padding: 1px 8px; font-size: 0.78rem; font-weight: 600; line-height: 1.6; white-space: nowrap;
  color: var(--b); background: color-mix(in srgb, var(--b) 13%, var(--surface)); }
.badge.soft { font-weight: 500; color: var(--muted); background: var(--surface-2); --b: var(--muted); }
.st-new { --b: var(--accent); }
.st-improved { --b: var(--good); }
.st-unchanged { --b: var(--muted); font-weight: 500; }
.st-carried-over { --b: var(--faint); font-weight: 500; background: transparent; border: 1px dashed var(--border-strong); }
.row-body { padding: 4px 4px 20px; display: grid; gap: 12px; }
@media (min-width: 720px) { .row-body { padding-left: var(--indent-md); } }
@media (min-width: 1200px) { .row-body { padding-left: var(--indent-lg); } }
.row-body h5 { font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); margin: 0 0 4px; font-weight: 600; }
.locs { display: flex; flex-direction: column; gap: 2px; }
.copy-btn { justify-self: start; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 8px; padding: 6px 12px; min-height: 36px; font: inherit; font-size: 0.8125rem; cursor: pointer; }
.copy-btn:hover { color: var(--text); border-color: var(--border-strong); }
.gh-closed { color: var(--faint); }
.empty { padding: 20px 4px; color: var(--muted); }

/* Zugeklappte Sektionen */
details.fold { border-top: 1px solid var(--border); padding-top: 14px; }
details.fold > summary { cursor: pointer; font-size: 1.15rem; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details.fold[open] > summary { margin-bottom: 10px; }
.ack { opacity: 0.85; }
.ack li { margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 0.9rem; max-width: 72ch; }
.kv dt { color: var(--faint); }
.kv dd { margin: 0; }
.formula { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre; max-width: 100%; }
footer { margin-top: 56px; font-size: 0.8125rem; color: var(--faint); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

// --- Markdown-Subset: Absätze, »- «-Listen, `code`, **fett**, *kursiv*, [text](https://…)
// Eigener Regex je Aufruf: inline() ruft sich für **fett** rekursiv auf, ein
// geteilter lastIndex setzte die äußere Schleife sonst endlos auf 0 zurück.
var INLINE_SRC = '(`[^`]+`)|(\\*\\*[^*]+\\*\\*)|(\\*[^*\\s][^*]*\\*)|(\\[[^\\]]+\\]\\((https?:\\/\\/[^)\\s]+)\\))';
function inline(text) {
  var out = [], last = 0, m, INLINE = new RegExp(INLINE_SRC, 'g');
  text = String(text);
  while ((m = INLINE.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[1]) out.push(h('code', null, m[1].slice(1, -1)));
    else if (m[2]) out.push(h('strong', null, inline(m[2].slice(2, -2))));
    else if (m[3]) out.push(h('em', null, inline(m[3].slice(1, -1))));
    else if (m[4]) out.push(h('a', { href: m[5], rel: 'noopener noreferrer', target: '_blank' }, m[4].slice(1, m[4].indexOf(']('))));
    last = INLINE.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function md(text, cls) {
  var box = h('div', { 'class': 'prose' + (cls ? ' ' + cls : '') });
  if (!text) return box;
  String(text).replace(/\r/g, '').split(/\n\s*\n/).forEach(function (block) {
    var para = [], list = null;
    function flush() { if (para.length) { box.appendChild(h('p', null, inline(para.join(' ')))); para = []; } }
    block.split('\n').forEach(function (line) {
      var li = line.match(/^\s*[-*•]\s+(.*)$/);
      if (li) {
        flush();
        if (!list) { list = h('ul'); box.appendChild(list); }
        list.appendChild(h('li', null, inline(li[1])));
      } else if (line.trim()) {
        if (list && /^\s{2,}/.test(line)) { add(list.lastChild, [' '].concat(inline(line.trim()))); return; }
        list = null;
        para.push(line.trim());
      }
    });
    flush();
  });
  return box;
}

function layeredDiagram(d) {

      var content = [n.label, n.detail ? h('small', null, n.detail) : null];
      var el = n.component && COMP[n.component]
        ? h('button', { 'class': 'node', type: 'button', onclick: function () { setFilter({ comp: [n.component] }); } }, content)
        : h('div', { 'class': 'node' }, content);
      nodeEls[n.id] = el;

      if (layerOf[e.from] === layerOf[e.to]) {
        var y = Math.min(ra.top, rb.top) - box.top;

    ghMeta(f.github));
  var summary = h('summary', null,
    cfg.prio ? h('span', { 'class': 'c-sev' }, sevBadge(f.severity)) : null,
    h('span', { 'class': 'c-id' }, f.id),
    cfg.feat ? h('span', { 'class': 'c-feat' + (comp ? '' : ' faint') }, comp ? comp.label : '–') : null,
    h('span', { 'class': 'c-desc' }, h('span', { 'class': 'c-title' }, inline(f.title)), meta),
    h('span', { 'class': 'c-dom' }, h('span', { 'class': 'badge soft' }, domLabel(f.domain))),
    h('span', { 'class': 'c-cat' }, T.cat[f.category]),
    h('span', { 'class': 'c-effort' }, f.effort || '–'),
    cfg.status ? h('span', { 'class': 'c-status' }, statusBadge(f)) : null);
  var copyBtn = h('button', { 'class': 'copy-btn', type: 'button' }, T.copy);
  copyBtn.addEventListener('click', function () { copyText(toMarkdown(f), copyBtn); });
  var body = h('div', { 'class': 'row-body' },
    (f.locations && f.locations.length) ? h('div', null, h('h5', null, T.locations), locList(f)) : null,
    h('div', null, h('h5', null, T.description), md(f.description)),
    f.evidence ? h('div', null, h('h5', null, T.evidence), md(f.evidence)) : null,
    h('div', null, h('h5', null, T.recommendation), md(f.recommendation)),
    f.github && f.github.note ? md(f.github.note, 'muted') : null,
    f.github && f.github.assignee ? h('div', { 'class': 'small muted' }, T.ghAssignee + ': ' + f.github.assignee) : null,
    copyBtn);
  var d = h('details', { 'class': 'row', id: 'f-' + f.id }, summary, body);
  d.addEventListener('toggle', function () {
    if (d.open) { state.f = f.id; writeHash(); }
    else if (state.f === f.id) { state.f = ''; writeHash(); }
  });
  ROWS[f.id] = d;
  return d;
}

// Spalten in Anzeigereihenfolge; lg: erst ab 1200 px eine eigene Spalte.
function tableColumns(cfg) {
  var c = [];
  if (cfg.prio) c.push({ w: 92, label: T.colSev });
  c.push({ w: 92, label: T.colId });
  if (cfg.feat) c.push({ w: 140, label: T.colFeat, lg: true });
  c.push({ w: 0, label: T.colTitle, desc: true });
  c.push({ w: 140, label: T.colDom });
  c.push({ w: 180, label: T.colCat, lg: true });
  c.push({ w: 56, label: T.colEffort });
  if (cfg.status) c.push({ w: 118, label: T.colStatus });
  return c;
}

function findingTable(list, cfg, extra) {
  var cols = tableColumns(cfg);
  function vars(lg) {
    var shown = cols.filter(function (c) { return lg || !c.lg; });
    var indent = 0;
    for (var i = 0; !shown[i].desc; i++) indent += shown[i].w + 12;
    return { cols: shown.map(function (c) { return c.desc ? 'minmax(0, 1fr)' : c.w + 'px'; }).join(' '), indent: indent };
  }
  var md_ = vars(false), lg = vars(true);
  var labels = h('div', { 'class': 'row-head-labels', 'aria-hidden': 'true' },
    cols.map(function (c) { return h('span', { 'class': c.lg ? 'h-lg' : null }, c.label); }));
  var rows = h('div', { 'class': 'rows' }, list.map(function (f) { return row(f, cfg); }));
  return {
    rows: rows,
    el: h('div', {
      'class': cfg.prio ? null : 'no-prio',
      style: '--cols-md:' + md_.cols + ';--cols-lg:' + lg.cols + ';--indent-md:' + md_.indent + 'px;--indent-lg:' + lg.indent + 'px'
    }, extra, labels, rows)
  };
}

function chipGroup(label, key, values, labelOf, counts) {
  var chips = h('div', { 'class': 'fchips' });
  var g = h('div', { 'class': 'fgroup', role: 'group', 'aria-label': label }, h('span', { 'class': 'flabel' }, label), chips);
  values.forEach(function (v) {
    var n = counts[v] || 0;
    var b = h('button', { 'class': 'fbtn', type: 'button', 'aria-pressed': 'false', 'data-key': key, 'data-value': v, disabled: !n },
      labelOf(v), h('span', { 'class': 'n' }, n));
    b.addEventListener('click', function () {
      var arr = state[key], i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else arr.push(v);
      if (key === 'dom') syncCategoryOptions();
      applyFilters(); writeHash();
    });
    chips.appendChild(b);
  });
  return g;
}

var ui = {};
function countBy(list, fn) { var o = {}; list.forEach(function (f) { var k = fn(f); if (k != null) o[k] = (o[k] || 0) + 1; }); return o; }

// Kategorie-Chips folgen dem Bereichsfilter: was in keinem gewählten Bereich
// vorkommt, verschwindet und fällt aus der Auswahl.
function syncCategoryOptions() {
  var allowed = countBy(DEFECTS.filter(function (f) { return !state.dom.length || state.dom.indexOf(f.domain) >= 0; }), function (f) { return f.category; });
  Array.prototype.forEach.call(ui.cats.querySelectorAll('.fbtn'), function (b) { b.hidden = !allowed[b.getAttribute('data-value')]; });
  state.cat = state.cat.filter(function (c) { return allowed[c]; });
}

function backlog() {
  var filters = h('div', { 'class': 'filters' });
  filters.appendChild(chipGroup(T.domain, 'dom', ['code', 'harness'], domLabel, countBy(DEFECTS, function (f) { return f.domain; })));
  filters.appendChild(chipGroup(T.severity, 'sev', SEVS, function (v) { return T.sev[v]; }, countBy(DEFECTS, function (f) { return f.severity; })));
  if (COMPONENTS.length) {
    var compVals = COMPONENTS.map(function (c) { return c.id; });
    if (DEFECTS.some(function (f) { return !f.component; })) compVals.push(NONE);
    filters.appendChild(chipGroup(T.feature, 'comp', compVals, function (v) { return v === NONE ? T.projectWide : COMP[v].label; }, countBy(DEFECTS, function (f) { return f.component || NONE; })));
  }
  if (FOLLOWUP) filters.appendChild(chipGroup(T.status_, 'st', STATUSES, function (v) { return T.status[v]; }, countBy(DEFECTS, function (f) { return f.status; })));
  var catCounts = countBy(DEFECTS, function (f) { return f.category; });
  var catVals = Object.keys(catCounts).sort(function (a, b) { return T.cat[a].localeCompare(T.cat[b]); });
  ui.cats = chipGroup(T.category, 'cat', catVals, function (v) { return T.cat[v]; }, catCounts);
  filters.appendChild(ui.cats);
  ui.q = h('input', { type: 'search', placeholder: T.search, 'aria-label': T.search });
  var timer;
  ui.q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { state.q = ui.q.value.trim(); applyFilters(); writeHash(); }, 150); });
  filters.appendChild(h('div', { 'class': 'fgroup' }, h('span', { 'class': 'flabel' }, T.searchLabel), ui.q));
  ui.count = h('span');
  ui.reset = h('button', { 'class': 'linkish', type: 'button', hidden: true }, T.reset);
  ui.reset.addEventListener('click', function () { setFilter({}); });
  filters.appendChild(h('div', { 'class': 'fstatus' }, ui.count, ui.reset));

  var table = findingTable(DEFECTS, { prio: true, feat: COMPONENTS.length > 0, status: FOLLOWUP }, filters);
  ui.rows = table.rows;
  ui.empty = h('div', { 'class': 'empty', hidden: true }, T.nothingMatches);
  table.el.appendChild(ui.empty);
  return section('backlog', T.backlog, table.el);
}

function matches(f) {
  if (state.dom.length && state.dom.indexOf(f.domain) < 0) return false;
  if (state.sev.length && state.sev.indexOf(f.severity) < 0) return false;
  if (state.st.length && state.st.indexOf(f.status) < 0) return false;
  if (state.comp.length && state.comp.indexOf(f.component || NONE) < 0) return false;
  if (state.cat.length && state.cat.indexOf(f.category) < 0) return false;
  if (state.q) {
    var hay = (f.id + ' ' + f.title + ' ' + f.location + ' ' + (f.locations || []).join(' ')).toLowerCase();
    if (state.q.toLowerCase().split(/\s+/).some(function (w) { return hay.indexOf(w) < 0; })) return false;
  }
  return true;
}

function applyFilters() {
  var shown = 0;
  DEFECTS.forEach(function (f) { var ok = matches(f); ROWS[f.id].hidden = !ok; if (ok) shown++; });
  ui.count.textContent = T.shown(shown, DEFECTS.length);
  ui.empty.hidden = shown > 0;
  var active = state.dom.length || state.sev.length || state.st.length || state.comp.length || state.cat.length || state.q;
  ui.reset.hidden = !active;
  Array.prototype.forEach.call(document.querySelectorAll('.fbtn'), function (b) {
    b.setAttribute('aria-pressed', state[b.getAttribute('data-key')].indexOf(b.getAttribute('data-value')) >= 0 ? 'true' : 'false');
  });
  if (ui.q.value.trim() !== state.q) ui.q.value = state.q;
}

function setFilter(next) {
  state.dom = next.dom || []; state.sev = next.sev || []; state.st = next.st || []; state.comp = next.comp || [];
  state.cat = next.cat || []; state.q = next.q || '';
  syncCategoryOptions(); applyFilters(); writeHash();
  var b = document.getElementById('backlog');
  if (b && Object.keys(next).length) b.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function openFinding(id) {
  var d = ROWS[id] || document.getElementById('f-' + id);
  if (!d) return;
  if (d.hidden) setFilter({});
  var fold_ = d.closest('details.fold');
  if (fold_) fold_.open = true;
  d.open = true;
  d.scrollIntoView({ block: 'start' });
}

// --- Übrige Sektionen
function openQuestions() {
  var q = D.openQuestions || [];
  if (!q.length) return null;
  return section('open-questions', T.openQuestions, h('ul', { 'class': 'prose wide' }, q.map(function (x) { return h('li', null, md(x, 'wide')); })));
}

function improvements() {
  if (!IMPROVEMENTS.length) return null;
  var table = findingTable(IMPROVEMENTS, { prio: false, feat: COMPONENTS.length > 0, status: false });
  // Nicht in ROWS: die Backlog-Filter gelten nur für Defekte. openFinding() findet sie über die id.
  IMPROVEMENTS.forEach(function (f) { delete ROWS[f.id]; });
  return section('improvements', T.improvements, table.el);
}

function methodology() {
  var m = D.methodology || {};
  var box = h('div');
  box.appendChild(md(m.text));
  var sc = S.scope;
  if (sc) {
    box.appendChild(h('h3', { style: 'margin:20px 0 8px' }, T.scopeTitle));
    box.appendChild(h('dl', { 'class': 'kv' },
      h('dt', null, T.sourceFiles), h('dd', null, NUM.format(sc.sourceFiles)),
      h('dt', null, T.sourceLoc), h('dd', null, NUM.format(sc.sourceLoc) + ' LOC'),
      h('dt', null, T.reviewedLoc), h('dd', null, NUM.format(sc.reviewedLoc) + ' LOC (' + (sc.sourceLoc ? Math.round(100 * sc.reviewedLoc / sc.sourceLoc) : 0) + ' %)' +
        (sc.reviewedFiles ? ' · ' + sc.reviewedFiles.length + ' ' + T.sourceFiles : '')),
      sc.exclusions && sc.exclusions.length ? [h('dt', null, T.exclusions), h('dd', { 'class': 'mono' }, sc.exclusions.join(', '))] : null));
  }
  var scoring = S.scoring || { model: S.scoreModel || 1, weights: { critical: 10, high: 5, medium: 2, low: 0.5 } };
  box.appendChild(h('h3', { style: 'margin:20px 0 8px' }, T.formulaTitle));
  box.appendChild(h('div', { 'class': 'formula' }, scoring.model === 2 ? T.formula2(scoring) : T.formula1(scoring)));
  box.appendChild(h('p', { 'class': 'prose small muted', style: 'margin-top:8px' }, scoring.model === 2 ? T.formula2Note : T.formula1Note));
  var notes = [];
  if (S.deltaBreakdown) notes.push(T.deltaBreakdown(S.deltaBreakdown));
  if (S.deltaExplanation) notes.push(S.deltaExplanation);
  notes = notes.concat(m.notes || []);
  notes.push(T.theme(S.theme));
  box.appendChild(h('h3', { style: 'margin:20px 0 8px' }, T.notesTitle));
  box.appendChild(h('ul', { 'class': 'prose' }, notes.map(function (n) { return h('li', null, inline(n)); })));
  return h('section', null, fold('methodology', T.methodology, box, false));
}

function acknowledgedSection() {
  var a = D.acknowledged || [];
  if (!a.length) return null;
  var list = h('ul', { 'class': 'prose ack' }, a.map(function (x) {
    return h('li', null, h('strong', null, inline(x.title)), ' · ', h('span', { 'class': 'muted' }, T.cat[x.category] || x.category), ' · ', h('span', { 'class': 'mono' }, x.location),
      h('div', { 'class': 'muted' }, inline(x.reason), ' — ', fmtDate(x.acknowledgedDate), x.github && x.github.url ? [' · ', ghMeta(x.github)] : null));
  }));
  return h('section', null, fold('acknowledged', T.acknowledged + ' (' + a.length + ')', [h('p', { 'class': 'prose muted' }, T.ackIntro), list], false));
}

// --- Aufbau
document.title = S.project + ' · Audit ' + fmtDate(S.date);
var app = document.getElementById('app');
[header(), portrait(), summarySection(), historySection(), backlog(), improvements(), openQuestions(), methodology(), acknowledgedSection(),
  h('footer', { 'class': 'no-print' }, T.generated + ' ' + (D.meta.generatedAt ? D.meta.generatedAt.slice(0, 16).replace('T', ' ') : '') + ' · ' + T.template + ' ' + (D.meta.templateVersion || ''))
].forEach(function (x) { add(app, x); });

readHash();
syncCategoryOptions();
applyFilters();
if (state.f) openFinding(state.f);
window.addEventListener('hashchange', function () { readHash(); syncCategoryOptions(); applyFilters(); if (state.f) openFinding(state.f); });

// Drucken: alles aufgeklappt, danach wie vorher
var reopen = [];
window.addEventListener('beforeprint', function () {
  reopen = Array.prototype.filter.call(document.querySelectorAll('details'), function (d) { return !d.open; });
  reopen.forEach(function (d) { d.open = true; });
});
window.addEventListener('afterprint', function () { reopen.forEach(function (d) { d.open = false; }); reopen = []; });
})();
</script>
</body>
</html>
