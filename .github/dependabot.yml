version: 2
updates:
  # the four catalog entries in pnpm-workspace.yaml are the peer dependencies of the
  # library, and playwright moves the browsers the test suite runs on; each of their
  # updates comes as a pull request of its own
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      toolchain:
        patterns: ['*']
        exclude-patterns:
          - three
          - '@types/three'
          - '@spearwolf/eventize'
          - '@spearwolf/signalize'
          - playwright
        update-types: [minor, patch]
    # the lookbook holds typescript at 6.x for astro check, whose @astrojs/check peer
    # range ends at ^6.0.0; one entry covers the whole workspace, so this also holds back
    # a major of the root's typescript. Drop it once @astrojs/check accepts 7
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  # keeps the commit SHAs the workflows pin, and the version comment next to each, current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
