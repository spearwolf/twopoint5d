name: Deploy

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # one deploy at a time. By default a group keeps a single run waiting and a newer
  # run cancels it, so a version bump whose deploy waited behind another would never
  # be published; queue: max lets up to 100 runs wait their turn
  group: deploy
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Check whether npm has this version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # every job works on the commit the CI run names, so only a push to this
    # repository may name it
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit the CI run tested; main may have moved on since
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: packages/twopoint5d/package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compare the manifest version with npm
        id: check
        # publishNpmPkg.mjs skips the same two cases; this check only spares
        # install and build
        run: |
          name=$(node -p "require('./packages/twopoint5d/package.json').name")
          version=$(node -p "require('./packages/twopoint5d/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-dev ]]; then
            echo "$version is a development version"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npm view "$name@$version" version > npm-view.out 2> npm-view.err
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ -s npm-view.out ]; then
            echo "$name@$version is on npm already"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ] || grep -q E404 npm-view.err; then
            echo "$name@$version is not on npm yet"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat npm-view.err
            exit 1
          fi

  build:
    name: Build and check the package
    needs: version
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # reads the repository and holds no other right: every dependency of the build and its
    # install script runs in this job, away from the publish rights
    env:
      # nothing in this job runs a browser
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the same commit the version job read
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # installs the pnpm that packageManager in package.json names
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the workspace root and the library
        # the root and the library hold the toolchain of the build and the checks; the
        # lookbook, the browser tests, their dependencies and their install scripts stay out
        run: pnpm install --frozen-lockfile --filter twopoint5d-workspace --filter @spearwolf/twopoint5d

      - name: Audit the installed dependencies
        # the toolchain this job installs builds and checks the package the publish job
        # uploads, so a high or critical advisory in it stops the deploy. pnpm audit reads
        # the whole lockfile and takes no --filter; the script keeps the advisories reached
        # from the two projects installed above. An audit without an answer stops the
        # deploy as well: re-run the job once the registry answers. pnpm audit gets 90
        # seconds, inside the two minutes of the step, so what it printed reaches the log.
        run: |
          status=0
          timeout -k 10 90 pnpm audit --json > "$RUNNER_TEMP/pnpm-audit.json" 2> "$RUNNER_TEMP/pnpm-audit.err" || status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "pnpm audit gave no answer within 90 seconds" >> "$RUNNER_TEMP/pnpm-audit.err"
          fi
          if ! node scripts/ci/auditInstalledDependencies.mjs --report "$RUNNER_TEMP/pnpm-audit.json" --importer . --importer packages/twopoint5d; then
            cat "$RUNNER_TEMP/pnpm-audit.err"
            exit 1
          fi
        timeout-minutes: 2

      # builds from source: the Nx cache of the CI workflow never reaches a
      # published package
      - name: Build the package
        run: pnpm --filter @spearwolf/twopoint5d run build

      - name: Check the package
        # the checks publishNpmPkg runs before it publishes, here without the
        # publish rights
        run: |
          pnpm --filter @spearwolf/twopoint5d run checkPkgTypes
          pnpm --filter @spearwolf/twopoint5d run lintPkg
          pnpm --filter @spearwolf/twopoint5d run checkNameableTypes

      - name: Hand the package to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: packages/twopoint5d/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the package to npm
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the publish script, and the license, changelog and readme it copies
          # into the package
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@spearwolf'

      - name: Take the package the build job checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: packages/twopoint5d/dist

      # installs nothing: with the publish rights run publishNpmPkg.mjs, its
      # helpers and npm
      - name: Publish npm packages
        working-directory: packages/twopoint5d
        env:
          # dist/package.json comes from the build job, so npm runs none of its
          # lifecycle scripts with the publish rights
          npm_config_ignore_scripts: 'true'
        run: node ../../scripts/publishNpmPkg.mjs dist

  tag:
    name: Tag the published version
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # creates the tag through the REST API; the job checks nothing out and
      # installs nothing
      contents: write
    steps:
      - name: Tag the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        # a version gets its tag once, from the deploy that published it; a tag that
        # exists already stays as it is
        run: |
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2> /dev/null); then
            if [ "$existing" != "$SHA" ]; then
              echo "::warning::$TAG exists already and points at $existing, not at $SHA"
            else
              echo "$TAG exists already"
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA"
          fi
