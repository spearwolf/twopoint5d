name: Continuous Integration

# every push, Markdown included: a Markdown file is an input of the type check of the
# docs' marked code blocks. A pull request runs the gate as well; one from a branch of
# this repository skips it there, the push of that branch has run it already
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Nx shows the output of failed tasks only; static prints every task's log, one after
  # the other
  NX_DEFAULT_OUTPUT_STYLE: static

concurrency:
  # on main each commit gets a group of its own, so none is cancelled or displaced from
  # the queue and the deploy workflow has a result to follow; on other branches a newer
  # push replaces the run of the older one, and a pull request is grouped by its merge ref
  # (refs/pull/<n>/merge), so a newer push to it replaces its older run
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The gate of `pnpm run ci`, cut into five jobs that run side by side: a red one names
    # its part of the gate, the others still report theirs, and "Re-run failed jobs" repeats
    # only what failed. The deploy workflow follows the conclusion of the whole run, so every
    # job has to pass.
    # a pull request from a fork has no push run in this repository; one from a branch
    # here has, and a second run of the same commit would only double the minutes
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # a hosted job runs for six hours by default; one whose apt stalled did once for over
    # twenty minutes before it was cancelled by hand
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ci:checks runs on both Node lines engines allows: it is the part in which Node
        # runs the tooling itself — the build, the type checks, the package checks and
        # the node --test specs of the scripts. The other parts run on 24 alone
        include:
          - task: checks
            name: Lint, build and check (Node 24)
            run: pnpm run ci:checks
            node: 24
          - task: checks
            name: Lint, build and check (Node 26)
            run: pnpm run ci:checks
            node: 26
          - task: coverage
            name: Unit tests with coverage
            run: pnpm run test:coverage
            node: 24
          - task: allocations
            name: Hot-path allocations
            run: pnpm run test:allocations
            node: 24
          - task: browser
            name: Browser tests
            run: xvfb-run pnpm run test:browser
            browsers: true
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing in this workflow pushes, so no token waits in .git/config for an
          # install script to find
          persist-credentials: false

      # installs the pnpm that packageManager in package.json names
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5

      - name: Audit dependencies
        # reports high and critical advisories without failing the run: the published
        # package declares peer dependencies only (lintPkg holds that), so whatever this
        # finds sits in tooling, and Dependabot proposes the update that fixes it. A hit
        # puts a warning on the summary page of the run and the report into the job
        # summary, where it does not sit unread in the log of a green step;
        # continue-on-error keeps an audit that times out from failing the job. The
        # dependencies are the same under both Node lines, so one job audits them
        if: matrix.task == 'checks' && matrix.node == 24
        run: |
          status=0
          pnpm audit --audit-level=high > "$RUNNER_TEMP/pnpm-audit.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/pnpm-audit.txt"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=pnpm audit::pnpm audit --audit-level=high exited with $status: high or critical advisories, or no answer from the registry. The job summary holds the report."
            {
              echo '### pnpm audit --audit-level=high'
              echo
              echo '```'
              cat "$RUNNER_TEMP/pnpm-audit.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true
        timeout-minutes: 2

      - name: Read the Playwright version
        if: matrix.browsers
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        if: matrix.browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Bound the network waits of apt
        # apt-get update once fell back from the Azure mirror to archive.ubuntu.com and
        # then waited on a silent connection for over twenty minutes: apt has no overall
        # timeout of its own. With these a stalled fetch fails within a minute and is retried
        if: matrix.browsers
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network-timeouts

      - name: Install Playwright browsers and their system libraries
        if: matrix.browsers && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox
        timeout-minutes: 8

      - name: Install the system libraries of the Playwright browsers
        # the cache holds the browsers, not the apt packages they link against. Each attempt
        # is cut off after three minutes — it takes some twenty seconds when the mirrors answer
        if: matrix.browsers && steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          for attempt in 1 2 3; do
            timeout 180 pnpm exec playwright install-deps chromium firefox && exit 0
            echo "::warning::playwright install-deps failed or stalled (attempt $attempt of 3)"
          done
          exit 1
        timeout-minutes: 10

      - name: Restore the Nx cache
        id: nx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nx-cache
          # one cache per job: each saves what its own tasks produced, and two jobs of the
          # same commit would otherwise race for the same key. The Node line is part of the
          # key because the Nx hash of a task leaves it out: the Node 26 job would otherwise
          # replay what the Node 24 job computed and check nothing
          key: nx-${{ runner.os }}-${{ matrix.task }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ matrix.task }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-${{ matrix.task }}-node${{ matrix.node }}-

      - name: Start the Nx cache server
        # Nx indexes its local cache in a database named after the machine id, so a
        # restored ~/.nx means nothing to a new runner. Nx does take results from a
        # self-hosted remote cache; this one serves the directory actions/cache restored.
        run: |
          token=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          touch "$RUNNER_TEMP/nx-cache.start"
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN="$token" nohup node scripts/ci/nxCacheServer.mjs --dir "$RUNNER_TEMP/nx-cache" --port 47873 > "$RUNNER_TEMP/nx-cache-server.log" 2>&1 &
          curl --silent --output /dev/null --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:47873/v1/cache/0
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:47873" >> "$GITHUB_ENV"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
        timeout-minutes: 12

      - name: Drop the Nx cache entries this run did not use
        # the server touches every entry it serves; what is older than its start went
        # unused
        if: success() && steps.nx-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        run: find "$RUNNER_TEMP/nx-cache" -type f \( ! -newer "$RUNNER_TEMP/nx-cache.start" -o -name '*.partial' \) -delete

      - name: Save the Nx cache
        # only a push to this repository writes the cache; a pull request restores it and
        # saves nothing
        if: success() && steps.nx-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nx-cache
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}

      - name: Show the Nx cache server log
        if: failure()
        run: cat "$RUNNER_TEMP/nx-cache-server.log" || true

      - name: Archive coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.task == 'coverage'
        with:
          name: coverage
          path: packages/twopoint5d/coverage
          retention-days: 3
