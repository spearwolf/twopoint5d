name: Benchmarks

# The hot-path benchmarks, away from the gate of every push. Their timings are archived, not
# held to a limit: a shared runner's timings vary too much for a gate, and a regression shows
# only in the series over weeks. A nightly run on main builds that series; a run by hand
# measures a branch. What can be counted — the heap bytes of a hot-path call — the allocation
# specs hold in the gate of the CI workflow.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Run the hot-path benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # nothing in this job runs a browser
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # installs the pnpm that packageManager in package.json names
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the workspace root and the library
        run: pnpm install --frozen-lockfile --filter twopoint5d-workspace --filter @spearwolf/twopoint5d
        timeout-minutes: 5

      - name: Run the hot-path benchmarks
        # through pnpm, not Nx: the lookbook and the browser tests stay uninstalled here
        run: pnpm --filter @spearwolf/twopoint5d run bench
        timeout-minutes: 10

      - name: Archive benchmark results
        # named after the commit, so that the series over many runs can be read in order
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ github.sha }}
          path: packages/twopoint5d/bench-results
          retention-days: 90
