name: Benchmarks

# The hot-path benchmarks, away from the gate of every push. Their timings are archived, not
# held to a limit: a shared runner's timings vary too much for a gate, and a regression shows
# only in the series over weeks. A nightly run on main builds that series; a run by hand
# measures a branch. A nightly run measures a commit once — a night without a push would only
# add a second point for the same commit — and a run by hand always measures. What can be
# counted — the heap bytes of a hot-path call — the allocation specs hold in the gate of the
# CI workflow.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lookup:
    name: Look for the archive of this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # lists the artifacts of the repository; checks nothing out and installs nothing
    permissions:
      actions: read
    outputs:
      measure: ${{ steps.archive.outputs.measure }}
    steps:
      - name: Look for bench-${{ github.sha }}
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        # an archive past its 90 days counts as none, so a commit that stays the head of
        # main for longer is measured again
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kept=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-$GITHUB_SHA" --jq '[.artifacts[] | select(.expired | not)] | length')
          if [ "$kept" -gt 0 ]; then
            echo "bench-$GITHUB_SHA is archived already"
            echo "measure=false" >> "$GITHUB_OUTPUT"
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

  bench:
    name: Run the hot-path benchmarks
    needs: lookup
    if: ${{ needs.lookup.outputs.measure == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # nothing in this job runs a browser
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # installs the pnpm that packageManager in package.json names
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the workspace root and the library
        run: pnpm install --frozen-lockfile --filter twopoint5d-workspace --filter @spearwolf/twopoint5d
        timeout-minutes: 5

      - name: Run the hot-path benchmarks
        # through pnpm, not Nx: the lookbook and the browser tests stay uninstalled here
        run: pnpm --filter @spearwolf/twopoint5d run bench
        timeout-minutes: 10

      - name: Archive benchmark results
        # named after the commit, so that the series over many runs can be read in order; a
        # run that wrote no results.json fails here instead of leaving a gap in the series
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.sha }}
          path: packages/twopoint5d/bench-results/results.json
          if-no-files-found: error
          retention-days: 90
